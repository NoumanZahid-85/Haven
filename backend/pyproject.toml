[project]
name = "haven-backend"
version = "1.0.0"
description = "Haven — real-time voice companion for mental wellbeing"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "greenlet>=3.5.5",
    "groq>=0.30.0",
    "gunicorn>=21.0.0",
    "httpx>=0.28.1",
    "litellm>=1.40.0",
    "numpy>=1.26.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "redis>=5.0.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.52.1",
    # Silero VAD only (bundled ONNX model). No Daily/WebRTC transport — the
    # voice path is a plain WebSocket — so this now installs on Windows too.
    "pipecat-ai[silero]>=0.0.50",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
]

# ── Ruff ────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501", "B008"]  # line length handled by formatter, B008 for FastAPI Depends

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ── Pytest ──────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

# ── Pyright ─────────────────────────────────────────────────────────
[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = false
reportMissingModuleSource = false

