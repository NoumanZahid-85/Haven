# Render Blueprint for Haven — Postgres + Redis + backend + frontend.
# New → Blueprint → select this repo, then set the `sync: false` secrets.

databases:
  - name: haven-postgres
    plan: free
    region: frankfurt
    databaseName: haven
    user: haven
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

services:
  - type: keyvalue
    name: haven-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

  # ── Backend: FastAPI voice WebSocket (VAD → STT → LLM → TTS) ──────
  - type: web
    name: haven-backend
    runtime: docker
    plan: free
    region: frankfurt
    branch: master
    rootDir: backend
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: haven-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: haven-redis
          type: keyvalue
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_NAME
        value: Haven
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: info

  # ── Frontend: Next.js ──────────────────────────────────────────────
  - type: web
    name: haven-frontend
    runtime: node
    plan: free
    region: frankfurt
    branch: master
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      # Full URL of the backend service (baked in at build time).
      - key: NEXT_PUBLIC_BACKEND_URL
        value: https://haven-backend-d06n.onrender.com
      # Optional Supabase email/password login; omit for guest-only mode.
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
