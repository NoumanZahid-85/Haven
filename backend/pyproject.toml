[project]
name = "voicesell-backend"
version = "0.1.0"
description = "VoiceSell AI — Voice-enabled sales chatbot backend"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "greenlet>=3.5.5",
    "gunicorn>=21.0.0",
    "httpx>=0.28.1",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.60",
    "litellm>=1.40.0",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.0",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.19.0",
    "redis>=5.0.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.52.1",
    # Phase 5 — association rule mining (mine_associations.py script)
    "mlxtend>=0.23.0",
    "pandas>=2.0.0",
    # Phase 3 — voice pipeline (Linux/macOS only; daily-python has no Windows wheel).
    # In the Docker container (Linux) this installs automatically.
    # On Windows dev machines, install the mock extras (see [dependency-groups] below).
    "pipecat-ai[daily,deepgram,silero]>=0.0.50 ; sys_platform != 'win32'",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
]

# ── Ruff ────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501", "B008"]  # line length handled by formatter, B008 for FastAPI Depends

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ── Pytest ──────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

# ── Pyright ─────────────────────────────────────────────────────────
[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = false
reportMissingModuleSource = false

